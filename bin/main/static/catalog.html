<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Duel - カード図鑑</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'EB Garamond', serif; background: #080d1a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        .catalog-header { background: rgba(15, 25, 45, 0.95); border-bottom: 1.5px solid #c9a050; padding: 12px 20px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; z-index: 50; }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-back { background: rgba(255,255,255,0.05); border: 1px solid #c9a050; color: #c9a050; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .catalog-title { font-family: 'Cinzel Decorative', serif; font-size: 20px; color: #ffd700; }
        
        .search-filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .search-input { background: rgba(10,16,28,0.9); border: 1px solid #3c5473; border-radius: 6px; color: #f1e6cf; padding: 6px 12px; font-size: 14px; flex: 1; min-width: 180px; outline: none; }
        .search-input:focus { border-color: #ffd700; }

        .class-filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .class-tab { background: rgba(20,32,50,0.8); border: 1px solid #3c5473; color: #8ba880; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .class-tab.active { background: linear-gradient(135deg, #c9a050, #8a5a00); color: #000; border-color: #ffd700; }

        /* コスト別フィルターチップ */
        .cost-filter-group { display: flex; gap: 4px; align-items: center; }
        .cost-chip { width: 26px; height: 26px; background: rgba(20, 32, 50, 0.9); border: 1px solid #3c5473; border-radius: 50%; color: #00f0ff; font-size: 11px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .cost-chip:hover { border-color: #00f0ff; }
        .cost-chip.active { background: #00f0ff; color: #080d19; border-color: #fff; box-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }

        .catalog-main { flex: 1; padding: 20px; background: radial-gradient(circle, rgba(20,32,50,0.6) 0%, rgba(5,10,20,0.95) 100%); }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; justify-content: center; }
        .catalog-card { height: 155px; background: linear-gradient(145deg, #1c2b3d, #0e1724); border: 2px solid #4a668c; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; position: relative; cursor: pointer; transition: transform 0.15s; }
        .catalog-card:hover { transform: translateY(-3px); border-color: #c9a050; }
        .card-cost-badge { position: absolute; top: -6px; left: -6px; width: 24px; height: 24px; border-radius: 50%; background: #172d54; border: 1px solid #fff; color: #fff; font-size: 12px; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .card-name { font-size: 11px; font-weight: bold; color: #f1e6cf; text-align: center; margin-top: 14px; }
        .card-desc-preview { font-size: 9px; color: #b8c4d2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-stats { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 3px; }

        /* カード詳細モーダル (通常/進化切替対応) */
        #card-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .card-detail-modal { background: linear-gradient(145deg, #181124, #0d0914); border: 2px solid #c9a050; border-radius: 10px; width: 340px; padding: 20px; color: #f1e6cf; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 35px rgba(201, 160, 80, 0.4); }
        .modal-card-title { font-family: 'Cinzel Decorative', serif; font-size: 20px; color: #ffd700; text-align: center; }
        
        .modal-tab-container { display: flex; gap: 6px; margin-bottom: 2px; border-bottom: 1px solid #4a3e56; padding-bottom: 4px; }
        .modal-tab-btn { flex: 1; background: rgba(25, 18, 38, 0.8); border: 1px solid #4a3e56; border-radius: 4px; color: #a792ba; padding: 5px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .modal-tab-btn:hover { border-color: #c9a050; color: #fff; }
        .modal-tab-btn.active-tab { background: linear-gradient(135deg, #3b0764, #1e1b4b); border-color: #c084fc; color: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.4); }
        .stat-val-evolved { color: #c084fc !important; font-weight: bold; text-shadow: 0 0 6px rgba(192, 132, 252, 0.6); }

        .modal-card-desc { font-size: 11px; color: #e0d8e8; background: rgba(15,10,23,0.6); padding: 8px; border-radius: 4px; min-height: 45px; line-height: 1.4; }
        .modal-close-btn { background: linear-gradient(135deg, #c9a050, #8a5a00); border: none; color: #000; font-weight: bold; padding: 8px; border-radius: 6px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>
    <div class="catalog-header">
        <div class="header-top-row">
            <button class="btn-back" onclick="location.href='home.html'">‹ ホームへ戻る</button>
            <div class="catalog-title">CARD CATALOG</div>
            <div style="width: 70px;"></div>
        </div>

        <div class="search-filter-row">
            <input type="text" id="search-input" class="search-input" placeholder="カード名や効果で検索..." oninput="filterCards()">
            
            <!-- コスト別フィルター -->
            <div class="cost-filter-group">
                <span style="font-size: 11px; color: #8ba880;">Cost:</span>
                <div class="cost-chip active" onclick="filterByCost('ALL', this)">全</div>
                <div class="cost-chip" onclick="filterByCost(1, this)">1</div>
                <div class="cost-chip" onclick="filterByCost(2, this)">2</div>
                <div class="cost-chip" onclick="filterByCost(3, this)">3</div>
                <div class="cost-chip" onclick="filterByCost(4, this)">4</div>
                <div class="cost-chip" onclick="filterByCost(5, this)">5</div>
                <div class="cost-chip" onclick="filterByCost(6, this)">6+</div>
            </div>
        </div>

        <div class="class-filter-bar" id="class-filter-bar"></div>
    </div>

    <div style="font-size: 12px; color: #8ba880; padding: 10px 20px;" id="result-count">全 0 枚</div>
    <div class="catalog-main"><div class="card-grid" id="catalog-grid"></div></div>

    <!-- カード詳細モーダル (通常/進化タブ対応) -->
    <div id="card-modal-overlay" onclick="closeCardModal()">
        <div class="card-detail-modal" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; font-size: 11px; color: #a792ba;">
                <span id="modal-card-class" style="background: #2a1f35; padding: 2px 8px; border-radius: 4px; border: 1px solid #5a486e;">クラス</span>
                <span id="modal-card-rarity" style="background: #2a1f35; padding: 2px 8px; border-radius: 4px; border: 1px solid #5a486e;">一般</span>
            </div>

            <div class="modal-card-title" id="modal-card-name">名称</div>
            
            <!-- 通常/進化切替タブ -->
            <div class="modal-tab-container">
                <button id="tab-normal-btn" class="modal-tab-btn active-tab" onclick="switchModalState('normal')">通常時</button>
                <button id="tab-evolved-btn" class="modal-tab-btn" onclick="switchModalState('evolved')">進化後 (EP消費)</button>
            </div>

            <div style="display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); border: 1px solid #4a3e56; border-radius: 6px; padding: 6px; font-weight: bold; font-size: 12px;">
                <div>コスト: <span id="modal-card-cost" style="color: #00f0ff;">1</span></div>
                <div>攻撃力: <span id="modal-card-atk" style="color: #00f0ff;">0</span></div>
                <div>体力: <span id="modal-card-hp" style="color: #ff4d4d;">0</span></div>
            </div>

            <div style="font-size:11px; color:#c9a050;" id="modal-effect-label">■ 効果テキスト</div>
            <div class="modal-card-desc" id="modal-card-desc">効果テキスト</div>
            
            <div style="font-size:11px; color:#c9a050;">■ 備考</div>
            <div class="modal-card-desc" id="modal-card-note" style="min-height: 25px;">備考</div>

            <button class="modal-close-btn" onclick="closeCardModal()">閉じる</button>
        </div>
    </div>

    <script>
        let CARD_DATABASE = []; 
        let activeClassFilter = 'すべて';
        let activeCostFilter = 'ALL';
        let currentModalCardData = null;
        let isEvolvedTab = false;

        const classes = ['すべて', '貴族', '怪物', '幽霊', '無所属', '魔女', '人形', '狩人', '海賊'];

        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('card.csv').catch(() => null);
            if (res) CARD_DATABASE = parseCSV(await res.text());
            renderTabs(); 
            filterCards();
        });

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const h = lines[0].split(',').map(s => s.trim());
            return lines.slice(1).map((line, idx) => {
                const v = line.split(',').map(s => s.trim());
                let obj = {}; h.forEach((key, i) => obj[key] = v[i]);
                return {
                    id: obj['No'] || idx, 
                    class: obj['クラス'] || '無所属', 
                    name: obj['カード名'] || '不明',
                    type: obj['種別'] === '魔法' ? 'SPELL' : 'FOLLOWER', 
                    cost: Number(obj['コスト']) || 1,
                    attack: Number(obj['攻撃力']) || 0, 
                    hp: Number(obj['体力']) || 0,
                    desc: obj['効果テキスト'] || 'なし', 
                    note: obj['備考'] || 'なし'
                };
            });
        }

        function renderTabs() {
            const bar = document.getElementById('class-filter-bar');
            bar.innerHTML = '';
            classes.forEach(cls => {
                const b = document.createElement('div');
                b.className = `class-tab ${activeClassFilter === cls ? 'active' : ''}`;
                b.innerText = cls; 
                b.onclick = () => { activeClassFilter = cls; renderTabs(); filterCards(); };
                bar.appendChild(b);
            });
        }

        function filterByCost(costVal, element) {
            activeCostFilter = costVal;
            document.querySelectorAll('.cost-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            filterCards();
        }

        function filterCards() {
            const kw = document.getElementById('search-input').value.toLowerCase().trim();
            const grid = document.getElementById('catalog-grid'); 
            grid.innerHTML = '';

            const filtered = CARD_DATABASE.filter(c => {
                // 1. クラス絞り込み
                if (activeClassFilter !== 'すべて' && c.class !== activeClassFilter) return false;
                
                // 2. コスト絞り込み
                if (activeCostFilter !== 'ALL') {
                    const cCost = Number(c.cost) || 0;
                    if (activeCostFilter === 6) {
                        if (cCost < 6) return false;
                    } else {
                        if (cCost !== activeCostFilter) return false;
                    }
                }

                // 3. キーワード検索
                if (kw) {
                    const nameMatch = (c.name || '').toLowerCase().includes(kw);
                    const descMatch = (c.desc || '').toLowerCase().includes(kw);
                    if (!nameMatch && !descMatch) return false;
                }

                return true;
            });

            document.getElementById('result-count').innerText = `全 ${filtered.length} 枚`;

            filtered.forEach(card => {
                const el = document.createElement('div');
                el.className = 'catalog-card';
                el.onclick = () => openCardModal(card);
                el.oncontextmenu = (e) => { e.preventDefault(); openCardModal(card); };
                el.innerHTML = `
                    <div class="card-cost-badge">${card.cost}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-desc-preview">${card.desc}</div>
                    <div class="card-stats">
                        <span style="color:#00f0ff;">⚔${card.attack}</span>
                        <span style="color:#ff4d4d;">❤${card.hp}</span>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        function openCardModal(c) {
            currentModalCardData = c;
            document.getElementById('modal-card-class').innerText = c.class || '無所属';
            document.getElementById('modal-card-name').innerText = c.name;
            switchModalState('normal');
            document.getElementById('card-modal-overlay').style.display = 'flex';
        }

        function switchModalState(state) {
            if (!currentModalCardData) return;
            isEvolvedTab = (state === 'evolved');
            const c = currentModalCardData;

            // タブのアクティブ切替
            document.getElementById('tab-normal-btn').classList.toggle('active-tab', !isEvolvedTab);
            document.getElementById('tab-evolved-btn').classList.toggle('active-tab', isEvolvedTab);

            const atkEl = document.getElementById('modal-card-atk');
            const hpEl = document.getElementById('modal-card-hp');
            const descEl = document.getElementById('modal-card-desc');
            const labelEl = document.getElementById('modal-effect-label');

            const baseAtk = Number(c.attack) || 0;
            const baseHp = Number(c.hp) || 0;

            if (isEvolvedTab) {
                atkEl.innerText = baseAtk + 2;
                atkEl.className = 'stat-val-evolved';
                hpEl.innerText = baseHp + 2;
                hpEl.className = 'stat-val-evolved';
                labelEl.innerText = '■ 進化時効果 / 能力';
                descEl.innerText = c.evolveDesc || `進化時：ステータス+2/+2され、このフォロワーは強力なオーラを纏う。`;
            } else {
                document.getElementById('modal-card-cost').innerText = c.cost;
                atkEl.innerText = baseAtk;
                atkEl.className = '';
                hpEl.innerText = baseHp;
                hpEl.className = '';
                labelEl.innerText = '■ 効果テキスト';
                descEl.innerText = c.desc || '効果なし';
            }

            document.getElementById('modal-card-note').innerText = c.note || 'なし';
        }

        function closeCardModal() { 
            document.getElementById('card-modal-overlay').style.display = 'none'; 
            currentModalCardData = null;
        }
    </script>
</body>
</html>
